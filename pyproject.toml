[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recuperaai-desktop"
version = "1.0.0.post100"
description = "RecuperaAI Desktop Local - auditoria operacional de notas fiscais"
requires-python = ">=3.11,<3.15"
authors = [{name = "RecuperaAI"}]
dependencies = [
  "PySide6>=6.7",
  "pypdf>=5.0",
  "requests>=2.32",
  "cryptography>=42.0",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "pyinstaller>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recuperaai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
recuperaai = [
  "database/schema.sql",
  "ui/chevron_down.svg",
  "ui/styles.qss",
]
